<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commander Voice</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --danger: #ef4444;
        --success: #22c55e;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .container {
        width: 100%;
        max-width: 680px;
        background: var(--card-bg);
        border-radius: 1rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      header {
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }
      p.subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
      }
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgba(15, 23, 42, 0.6);
        font-size: 0.9rem;
        font-weight: 500;
        text-align: center;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #64748b;
        transition: background 0.3s ease;
        flex-shrink: 0;
      }
      .status-dot.active {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }
      .status-dot.connecting {
        background: #eab308;
        box-shadow: 0 0 8px #eab308;
      }
      .status-dot.error {
        background: var(--danger);
        box-shadow: 0 0 8px var(--danger);
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .btn {
        background: var(--accent);
        color: #0f172a;
        border: none;
        border-radius: 2rem;
        padding: 0.85rem 2.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: var(--accent-hover);
        color: #fff;
        transform: translateY(-1px);
      }
      .btn.active {
        background: var(--danger);
        color: #fff;
      }
      .btn-secondary {
        background: #334155;
        color: var(--text);
        border: none;
        border-radius: 2rem;
        padding: 0.6rem 1.4rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-secondary:hover:not(:disabled) {
        background: #475569;
      }
      .btn-secondary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-danger {
        border: 1px solid var(--danger);
        color: var(--danger);
        background: transparent;
      }
      .btn-danger:hover:not(:disabled) {
        background: rgba(239, 68, 68, 0.15);
      }
      .input-row {
        display: flex;
        gap: 0.5rem;
      }
      .input-row input {
        flex: 1;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.6rem 0.8rem;
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
      }
      .input-row input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .input-row input:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .transcript-box {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        height: 260px;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .transcript-box p {
        color: #e2e8f0;
      }
      .transcript-box .system {
        color: var(--text-muted);
        font-style: italic;
        font-size: 0.85rem;
      }
      .tool-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--accent);
        padding: 0.4rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        font-family: monospace;
      }
      .inject-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: var(--success);
        padding: 0.4rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
      }
      .settings-panel {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .settings-title {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
      }
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }
      textarea {
        width: 100%;
        height: 70px;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.6rem 0.8rem;
        color: var(--text);
        font-family: inherit;
        font-size: 0.9rem;
        resize: vertical;
        line-height: 1.4;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Commander Voice</h1>
        <p class="subtitle">Talk to the Commander. It dispatches; the fleet works.</p>
      </header>

      <details class="settings-panel">
        <summary class="settings-title">Session Configuration</summary>
        <div class="input-group">
          <label for="systemPrompt"
            >System prompt override (empty = the built-in voice relay prompt):</label
          >
          <textarea
            id="systemPrompt"
            placeholder="Leave empty for the default Commander Voice prompt."
          ></textarea>
        </div>
      </details>

      <div class="status-bar">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Disconnected</span>
      </div>

      <div class="input-row">
        <input
          type="text"
          id="textInput"
          placeholder="Type context, a UID, or an instruction…"
          disabled
        />
        <button id="sendBtn" class="btn-secondary" disabled>Send</button>
      </div>

      <div class="controls">
        <button id="toggleBtn" class="btn">Start Conversation</button>
        <button id="updatesBtn" class="btn-secondary" disabled>Any updates?</button>
        <button id="stopBtn" class="btn-secondary btn-danger" disabled>Stop</button>
      </div>
      <div id="transcript" class="transcript-box">
        <p class="system">
          Click "Start Conversation", then talk. "Any updates?" drains the update buffer.
        </p>
      </div>
    </div>

    <script>
      const toggleBtn = document.getElementById("toggleBtn");
      const updatesBtn = document.getElementById("updatesBtn");
      const stopBtn = document.getElementById("stopBtn");
      const sendBtn = document.getElementById("sendBtn");
      const textInput = document.getElementById("textInput");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const transcript = document.getElementById("transcript");
      const systemPromptInput = document.getElementById("systemPrompt");

      let ws = null;
      let audioCtx = null;
      let micStream = null;
      let scriptProcessor = null;
      let nextStartTime = 0;
      let isConnected = false;
      let isSuppressed = false;
      let activeSources = [];
      let currentTextSpan = null;

      function flushPlayback() {
        for (const source of activeSources) {
          try {
            source.onended = null;
            source.stop();
          } catch (e) {}
        }
        activeSources = [];
        nextStartTime = 0;
      }

      function setStatus(text, state) {
        statusText.textContent = text;
        statusDot.className = "status-dot " + (state || "");
      }

      function addTranscriptText(text) {
        if (!currentTextSpan) {
          const p = document.createElement("p");
          p.innerHTML = "<strong>Voice: </strong><span></span>";
          transcript.appendChild(p);
          currentTextSpan = p.querySelector("span");
        }
        currentTextSpan.textContent += text;
        transcript.scrollTop = transcript.scrollHeight;
      }

      function resetTranscriptCurrent() {
        currentTextSpan = null;
      }

      function addSystemMessage(msg) {
        const p = document.createElement("p");
        p.className = "system";
        p.textContent = msg;
        transcript.appendChild(p);
        transcript.scrollTop = transcript.scrollHeight;
      }

      function addToolBadge(name, args) {
        resetTranscriptCurrent();
        const div = document.createElement("div");
        div.className = "tool-badge";
        div.textContent = `Tool invoked: ${name}(${JSON.stringify(args)})`;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
      }

      function addInjectBadge(text) {
        resetTranscriptCurrent();
        const div = document.createElement("div");
        div.className = "inject-badge";
        const preview = text.length > 90 ? text.slice(0, 90) + "..." : text;
        div.textContent = `Announced: ${preview}`;
        transcript.appendChild(div);
        transcript.scrollTop = transcript.scrollHeight;
      }

      function sendText(text) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "text", text }));
      }
      function handleSendInput() {
        const text = textInput.value.trim();
        if (!text) return;
        sendText(text);
        resetTranscriptCurrent();
        const p = document.createElement("p");
        p.innerHTML = "<strong>You: </strong><span></span>";
        p.querySelector("span").textContent = text;
        transcript.appendChild(p);
        transcript.scrollTop = transcript.scrollHeight;
        textInput.value = "";
      }

      updatesBtn.addEventListener("click", () => sendText("Any updates?"));
      stopBtn.addEventListener("click", () => {
        isSuppressed = true;
        flushPlayback();
      });
      sendBtn.addEventListener("click", handleSendInput);
      textInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSendInput();
        }
      });
      toggleBtn.addEventListener("click", () => {
        if (isConnected) {
          stopSession();
        } else {
          startSession();
        }
      });

      async function startSession() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus(
            "Microphone unavailable — open this page from localhost (secure context).",
            "error",
          );
          return;
        }
        setStatus("Requesting microphone access...", "connecting");
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              sampleRate: 16000,
              echoCancellation: true,
              noiseSuppression: true,
            },
          });
        } catch (err) {
          console.error("Microphone error:", err);
          setStatus("Microphone access denied: " + err.message, "error");
          return;
        }

        setStatus("Connecting to server...", "connecting");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws`);
        ws.binaryType = "arraybuffer";
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

        ws.onopen = () => {
          const instruction = systemPromptInput.value.trim();
          ws.send(
            JSON.stringify({
              type: "init",
              ...(instruction ? { systemInstruction: instruction } : {}),
            }),
          );
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const data = JSON.parse(event.data);
              if (data.type === "setupAck") {
                setStatus("Connected (Live)", "active");
                toggleBtn.textContent = "Stop Session";
                toggleBtn.classList.add("active");
                updatesBtn.disabled = false;
                stopBtn.disabled = false;
                sendBtn.disabled = false;
                textInput.disabled = false;
                isConnected = true;
                addSystemMessage('Session started. Speak or ask "any updates?".');
                startMicProcessing();
              } else if (data.type === "interrupt") {
                flushPlayback();
                resetTranscriptCurrent();
              } else if (data.type === "turnComplete") {
                isSuppressed = false;
              } else if (data.type === "text") {
                addTranscriptText(data.text);
              } else if (data.type === "inputText") {
                resetTranscriptCurrent();
                const p = document.createElement("p");
                p.innerHTML = "<strong>You: </strong><span></span>";
                p.querySelector("span").textContent = data.text;
                transcript.appendChild(p);
                transcript.scrollTop = transcript.scrollHeight;
              } else if (data.type === "toolLog") {
                addToolBadge(data.name, data.args);
              } else if (data.type === "injected") {
                addInjectBadge(data.text);
              }
            } catch (e) {
              console.error("JSON parse error:", e);
            }
          } else if (event.data instanceof ArrayBuffer) {
            if (!isSuppressed) {
              playPcmAudio(event.data);
            }
          }
        };

        ws.onerror = () => setStatus("Connection error", "error");
        ws.onclose = () => stopSession();
      }

      function startMicProcessing() {
        if (!micStream || !audioCtx) return;
        const source = audioCtx.createMediaStreamSource(micStream);
        const ratio = audioCtx.sampleRate / 16000;
        scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
        scriptProcessor.onaudioprocess = (e) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          const inputData = e.inputBuffer.getChannelData(0);
          const newLength = Math.floor(inputData.length / ratio);
          const pcm16 = new Int16Array(newLength);
          for (let i = 0; i < newLength; i++) {
            const originIndex = Math.floor(i * ratio);
            let s = Math.max(-1, Math.min(1, inputData[originIndex]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }
          ws.send(pcm16.buffer);
        };
        source.connect(scriptProcessor);
        scriptProcessor.connect(audioCtx.destination);
      }

      function playPcmAudio(arrayBuffer) {
        if (!audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const int16Array = new Int16Array(arrayBuffer);
        if (int16Array.length === 0) return;
        const float32Array = new Float32Array(int16Array.length);
        for (let i = 0; i < int16Array.length; i++) {
          float32Array[i] = int16Array[i] / 32768.0;
        }
        const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
        audioBuffer.getChannelData(0).set(float32Array);
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.onended = () => {
          const idx = activeSources.indexOf(source);
          if (idx !== -1) activeSources.splice(idx, 1);
        };
        activeSources.push(source);
        const now = audioCtx.currentTime;
        if (nextStartTime < now) nextStartTime = now;
        source.start(nextStartTime);
        nextStartTime += audioBuffer.duration;
      }

      function stopSession() {
        isConnected = false;
        isSuppressed = false;
        flushPlayback();
        resetTranscriptCurrent();
        updatesBtn.disabled = true;
        stopBtn.disabled = true;
        sendBtn.disabled = true;
        textInput.disabled = true;
        if (scriptProcessor) {
          scriptProcessor.disconnect();
          scriptProcessor = null;
        }
        if (micStream) {
          micStream.getTracks().forEach((t) => t.stop());
          micStream = null;
        }
        if (ws) {
          ws.onclose = null;
          ws.close();
          ws = null;
        }
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
        }
        toggleBtn.textContent = "Start Conversation";
        toggleBtn.classList.remove("active");
        setStatus("Disconnected", "");
        addSystemMessage("Session ended.");
      }
    </script>
  </body>
</html>
