name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make pnpm install flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ steps.filter.outputs.browser }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/sync-fdroid-changelogs.test.mjs

  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Verify dependency signatures
        run: pnpm audit signatures

      - name: Lint
        run: pnpm run lint

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Build server stack
        run: pnpm run build:server

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Verify public package contents
        run: |
          pnpm --filter @getpaseo/protocol pack --dry-run
          pnpm --filter @getpaseo/client pack --dry-run
          pnpm --filter @getpaseo/server pack --dry-run

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    steps: &server_test_steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/pnpm-retry.mjs add -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: pnpm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: pnpm --filter @getpaseo/server run test
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: pnpm --filter @getpaseo/server run test:hub-cli-contract

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: windows-latest
    steps: *server_test_steps

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies with retry
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Build server stack
        run: pnpm run build:server

      - name: Run desktop tests
        run: pnpm --filter @getpaseo/desktop run test

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Run desktop renderer E2E
        if: ${{ runner.os == 'Linux' }}
        run: pnpm --filter @getpaseo/desktop run test:e2e:renderer

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' }}
        run: pnpm --filter @getpaseo/desktop run test:e2e:browser-tabs
        env:
          PASEO_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      - name: Upload desktop browser diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and smoke unpacked desktop app
        if: ${{ runner.os == 'Linux' }}
        run: pnpm run build:desktop -- --publish never --linux --x64 --dir
        env:
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke

      - name: Upload packaged smoke diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-packaged-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *desktop_test_steps

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies with retry
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: pnpm run build:app-deps

      - name: Run app unit tests
        run: pnpm --filter @getpaseo/app run test

  sdk-tests:
    name: sdk-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Build client dependencies
        run: pnpm run build:client

      - name: Build plugin SDK
        run: pnpm run build:plugin

      - name: Run plugin SDK tests
        run: pnpm --filter @getpaseo/plugin run test

      - name: Typecheck plugin examples
        run: pnpm --filter @getpaseo/plugin run typecheck

      - name: Run protocol tests
        run: pnpm --filter @getpaseo/protocol run test

      - name: Run client tests
        run: pnpm --filter @getpaseo/client run test

      - name: Run highlight tests
        run: pnpm --filter @getpaseo/highlight run test

      - name: Typecheck client examples
        run: pnpm --filter @getpaseo/client run typecheck:examples

  playwright-1:
    name: playwright (shard 1/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "1/4"
      PLAYWRIGHT_ARTIFACT: "1"
    steps: &playwright_test_steps
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies with retry
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build server stack
        run: pnpm run build:server

      - name: Build native app dependency
        run: pnpm --filter @getpaseo/expo-two-way-audio run build

      - name: Install agent CLIs for provider tests
        run: node scripts/pnpm-retry.mjs add -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        run: pnpm --filter @getpaseo/app run test:e2e -- --shard=${{ env.PLAYWRIGHT_SHARD }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ env.PLAYWRIGHT_ARTIFACT }}
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  playwright-2:
    name: playwright (shard 2/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "2/4"
      PLAYWRIGHT_ARTIFACT: "2"
    steps: *playwright_test_steps

  playwright-3:
    name: playwright (shard 3/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "3/4"
      PLAYWRIGHT_ARTIFACT: "3"
    steps: *playwright_test_steps

  playwright-4:
    name: playwright (shard 4/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SHARD: "4/4"
      PLAYWRIGHT_ARTIFACT: "4"
    steps: *playwright_test_steps

  relay-tests:
    name: relay-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Build relay
        run: pnpm run build:relay

      - name: Run relay tests
        run: pnpm --filter @getpaseo/relay run test

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "1"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: &cli_test_steps
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Build server stack
        run: pnpm run build:server

      - name: Install agent CLIs for provider tests
        run: node scripts/pnpm-retry.mjs add -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        run: pnpm --filter @getpaseo/cli run test

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "2"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.cli != 'false') }}
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "3"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps
