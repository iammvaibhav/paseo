name: Deploy Relay

on:
  # Manual-only while relay.paseo.sh bridges traffic to the Fly deployment.
  # A release or main push must not redeploy the temporary Cloudflare bridge.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: node scripts/pnpm-retry.mjs install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @getpaseo/relay run typecheck

      - name: Deploy worker
        run: cd packages/relay && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
