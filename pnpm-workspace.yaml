packages:
  - "packages/expo-two-way-audio"
  - "packages/highlight"
  - "packages/plugin"
  - "packages/protocol"
  - "packages/client"
  - "packages/server"
  - "packages/app"
  - "packages/relay"
  - "packages/website"
  - "packages/desktop"
  - "packages/cli"

allowBuilds:
  dtrace-provider: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  node-pty: true
  unrs-resolver: true
  workerd: true

# Supply-chain hardening: refuse to resolve a package version published less
# than a week ago. Malicious releases are almost always pulled within days.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@getpaseo/client@0.8.0-beta.1"
  - "@getpaseo/highlight@0.8.0-beta.1"
  - "@getpaseo/plugin@0.8.0-beta.1"
  - "@getpaseo/protocol@0.8.0-beta.1"
  - "@getpaseo/relay@0.8.0-beta.1"
  - electron@44.2.0
minimumReleaseAgeStrict: false

overrides:
  "@codemirror/language": "6.12.4"
  "@types/react": "~19.2.0"
  "@codemirror/view": "6.43.6"
  lightningcss: "1.30.1"
  supports-color: "10.2.2"
  react: "19.1.0"
  react-dom: "19.1.0"
  react-native-reanimated: "4.3.1"
  react-native-worklets: "0.8.3"

hoistWorkspacePackages: true
